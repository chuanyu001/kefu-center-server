server:
  port: 8080
spring:
  application:
    name: customer-service-center
  datasource:
    url: jdbc:mysql://localhost:3306/kefu_center?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发时取消注释以查看SQL
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
knife4j:
  enable: true
  setting:
    language: zh-CN
ai:
  open:
    chat-url: ${AI_OPEN_CHAT_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    api-key: ${ARK_API_KEY}
    model: ${AI_OPEN_MODEL:glm-5-2-260617}
    connect-timeout: 10000
    read-timeout: 300000
logging:
  level:
    com.smartlink: debug
    org.springframework: warn
